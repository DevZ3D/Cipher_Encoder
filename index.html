
<!DOCTYPE html>

    <title>Caesar Cipher Encoder</title>

 <body>

  <h1>Cipher Encoder</h1>

  <form>
    <label>Plaintext:</label>
    <textarea name='plaintext'>Plain text!</textarea>

   <label>Shift:</label>
    <input type='number' name='shift' value='3' min='1' max='26'>
    <input type='submit' value='encrypt'>
  </form>
  
  
  

  <div id='output'>
  <label>Output:</label>
  <textarea name='ciphertext'>cipher text!</textarea>
  </div>

<script src='index.js'></script>
</body>
